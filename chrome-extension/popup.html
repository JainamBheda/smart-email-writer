<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Email Writer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Smart Email Writer</h1>
      <p class="subtitle">Used by the button inside Gmail.</p>

      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" type="url" placeholder="http://localhost:8080" autocomplete="off" />

      <label for="tone">Default tone</label>
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="casual">Casual</option>
        <option value="assertive">Assertive</option>
        <option value="empathetic">Empathetic</option>
        <option value="concise">Concise</option>
      </select>

      <button id="save" type="button">Save settings</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
