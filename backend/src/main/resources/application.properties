spring.application.name=smart-email-writer
server.port=${PORT:8080}

# Gemini REST API. The API key is appended to the URL by EmailGeneratorService.
# Supports both the original variable names (GEMINI_URL / GEMINI_KEY) and the
# clearer names used in .env.example (GEMINI_API_URL / GEMINI_API_KEY).
gemini.api.url=${GEMINI_API_URL:${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=}}
gemini.api.key=${GEMINI_API_KEY:${GEMINI_KEY:}}

# WebClient timeouts
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
gemini.response-timeout-ms=${GEMINI_RESPONSE_TIMEOUT_MS:30000}

# Comma separated origins allowed to call the API from a browser
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Allows a local .env file (copy of .env.example) as an alternative to shell variables
spring.config.import=optional:file:./.env[.properties]

logging.level.com.smartemail.writer=${LOG_LEVEL:INFO}
